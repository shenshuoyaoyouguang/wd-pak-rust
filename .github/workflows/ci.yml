name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # L1 自包含门禁：只跑不依赖仓库外资产的套件。
  # 未纳入：tests/golden.rs、tests/read_cli.rs、tests/write_cli.rs 需要
  # ../wd_pak_tool.py（Python 参考实现）与 ../release/*.pak（85MB + 133MB），
  # 二者均不在本仓库内，只能在有这些资产的机器上本地跑。
  test:
    name: L1 测试门禁
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 工具链版本
        run: rustc -vV && cargo -V

      - name: 单元测试
        run: cargo test --locked --lib

      - name: 自包含集成测试（格式 / LZSS / 界面逻辑）
        run: cargo test --locked --test format_basic --test lzss_golden --test browse --test gui_layout --test recent --test session --test workspace --test config --test gui_states --test gui_text

  build:
    name: 编译 ${{ matrix.target }}
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            artifact: wd-pak-x86_64-gnu
          - target: x86_64-unknown-linux-musl
            artifact: wd-pak-x86_64-musl
          - target: aarch64-unknown-linux-musl
            artifact: wd-pak-aarch64-musl
            extra_rustflags: -C linker=rust-lld
    steps:
      - uses: actions/checkout@v4

      - name: 安装 target
        run: rustup target add ${{ matrix.target }}

      - name: 编译 release
        env:
          EXTRA_RUSTFLAGS: ${{ matrix.extra_rustflags }}
        run: |
          # aarch64 交叉链接走 rust-lld（MANUAL.md 2.2），需把它加入 PATH
          if [ -n "$EXTRA_RUSTFLAGS" ]; then
            export PATH="$(rustc --print sysroot)/lib/rustlib/$(rustc -vV | sed -n 's/^host: //p')/bin:$PATH"
            export RUSTFLAGS="$EXTRA_RUSTFLAGS"
          fi
          cargo build --release --locked --target ${{ matrix.target }}

      - name: 冒烟（仅同架构目标可执行）
        if: matrix.target != 'aarch64-unknown-linux-musl'
        run: |
          BIN=target/${{ matrix.target }}/release/wd-pak
          file "$BIN"
          test "$("$BIN" --version)" = "1.0"

      - name: 按 dist/ 命名归档
        run: |
          mkdir -p out
          cp target/${{ matrix.target }}/release/wd-pak out/${{ matrix.artifact }}
          ls -l out

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: out/${{ matrix.artifact }}
          if-no-files-found: error

  # Windows x64：静态 CRT 单 exe（无 VC 运行库依赖），冒烟用仓库内 golden 包，
  # 不需要 Python 与外部大包。
  build-windows:
    name: 编译 x86_64-pc-windows-msvc
    needs: test
    runs-on: windows-latest
    env:
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@v4

      - name: 工具链版本
        run: rustc -vV

      - name: 编译 release
        run: cargo build --release --locked --target x86_64-pc-windows-msvc

      - name: 冒烟
        shell: pwsh
        run: |
          $exe = "target/x86_64-pc-windows-msvc/release/wd-pak.exe"
          $v = & $exe --version
          if ($v -ne "1.0") { Write-Error "版本输出不符: $v"; exit 1 }
          & $exe check tests/golden/layout/etc_mini_nocompress.pak
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & $exe list tests/golden/layout/etc_mini_nocompress.pak > $null
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: 按 dist/ 命名归档
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/wd-pak.exe out/wd-pak-x86_64-windows.exe

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: wd-pak-x86_64-windows
          path: out/wd-pak-x86_64-windows.exe
          if-no-files-found: error

  # 差分对拍：需要预先注册带 `wd-pak-fixtures` 标签的 self-hosted Linux runner，
  # 并在工作区上级目录准备 ../wd_pak_tool.py 与 ../release/{etc,lib_gs32}.pak。
  # 仅手动触发，避免普通 PR 因缺少外部大包误红；L2 长测不在此 job 内。
  differential-linux:
    name: 差分对拍（Python 基准）
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, linux, wd-pak-fixtures]
    timeout-minutes: 60
    env:
      WDPAK_REQUIRE_FIXTURES: "1"
    steps:
      - uses: actions/checkout@v4

      - name: 检查夹具与 Python
        run: |
          set -euo pipefail
          for f in ../wd_pak_tool.py ../release/etc.pak ../release/lib_gs32.pak; do
            test -f "$f" || { echo "缺少差分夹具: $f"; exit 1; }
          done
          if ! command -v python3 >/dev/null && ! command -v python >/dev/null; then
            echo "缺少 Python 3"; exit 1
          fi
          python3 --version 2>/dev/null || python --version
          ls -lh ../wd_pak_tool.py ../release/etc.pak ../release/lib_gs32.pak

      - name: 工具链版本
        run: rustc -vV && cargo -V

      - name: 差分对拍
        run: cargo test --locked --test golden --test read_cli --test write_cli
