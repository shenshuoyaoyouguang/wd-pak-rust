[package]
name = "wd-pak"
version = "1.0.0"
edition = "2021"
default-run = "wd-pak"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
# preserve_order: Map 用 IndexMap 保插入序 —— manifest 键序=遍历序、
# pack 的 files 键序一致性的共同前提（Python dict 3.7+ 语义）
serde_json = { version = "1", features = ["preserve_order"] }
rayon = "1.10"
thiserror = "1"
sha2 = "0.10"

[profile.release]
lto = true
codegen-units = 1
strip = true

[profile.release.package."*"]
opt-level = 3

[[bin]]
name = "wd-pak-gui"
path = "src/bin/wd-pak-gui.rs"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_System_Console",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Time",
    "Win32_UI_Controls",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_Ime",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
